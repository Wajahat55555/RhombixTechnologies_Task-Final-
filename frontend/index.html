<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kazmi Kitchen | Fresh Food Delivered</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header / Navbar -->
    <header class="navbar">
        <div class="logo"><span class="logo-icon">🍳</span> Kazmi<span>Kitchen</span></div>
        <div class="cart-btn" id="open-cart-btn">
            🛒 Cart <span id="cart-count">0</span>
        </div>
    </header>

    <!-- Hero Banner -->
    <section class="hero">
    <h1>Welcome to Kazmi Kitchen</h1>
    <p>Delicious homemade meals & fast delivery at your fingertips.</p>
    </section>

    <!-- Category Filters -->
    <div class="filter-container">
        <button class="filter-btn active" data-category="All">All</button>
        <button class="filter-btn" data-category="Burgers">Burgers</button>
        <button class="filter-btn" data-category="Pizza">Pizza</button>
        <button class="filter-btn" data-category="Drinks">Drinks</button>
        <button class="filter-btn" data-category="Desserts">Desserts</button>
    </div>

    <!-- Food Menu Grid -->
    <main class="menu-container" id="menu-container"></main>

    <!-- Cart Overlay & Sidebar -->
    <div class="cart-overlay" id="cart-overlay"></div>
    <aside class="cart-sidebar" id="cart-sidebar">
        <div class="cart-header">
            <h2>Your Cart</h2>
            <button id="close-cart-btn">&times;</button>
        </div>
        <div class="cart-items" id="cart-items"></div>
        <div class="cart-footer">
            <div class="total-price-container">
                <span>Total:</span>
                <span id="cart-total-price">$0.00</span>
            </div>
            <button class="checkout-btn" id="checkout-btn">Proceed to Checkout</button>
        </div>
    </aside>

    <!-- Checkout Modal -->
    <div class="modal-overlay" id="checkout-modal">
        <div class="modal-content">
            <h2>Checkout Details</h2>
            <form id="checkout-form">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" required placeholder="John Doe">
                </div>
                <div class="form-group">
                    <label for="address">Delivery Address</label>
                    <textarea id="address" required rows="3" placeholder="123 Main Street..."></textarea>
                </div>
                <div class="form-group">
                    <label for="payment">Payment Method</label>
                    <select id="payment" required>
                        <option value="Cash on Delivery">Cash on Delivery</option>
                        <option value="Credit/Debit Card">Credit / Debit Card</option>
                    </select>
                </div>
                <div class="modal-actions">
                    <button type="button" class="cancel-btn" id="close-modal-btn">Cancel</button>
                    <button type="submit" class="submit-btn">Place Order</button>
                </div>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
